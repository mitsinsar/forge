<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#171a35"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.35" stop-color="#22d3ee"/>
      <stop offset="0.7" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f472b6" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
    <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f472b6"/></marker>
  </defs>

  <rect width="1200" height="860" rx="28" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="70" font-size="40" font-weight="800" fill="url(#title)" letter-spacing="1">forge</text>
  <text x="182" y="68" font-size="18" fill="#cbd5e1">one sentence  →  rigged, animated game character</text>
  <g font-size="13" fill="#94a3b8">
    <rect x="896" y="44" width="244" height="32" rx="16" fill="#ffffff0d" stroke="#ffffff22"/>
    <text x="1018" y="65" text-anchor="middle">⚡ runs locally on your GPU</text>
  </g>

  <!-- ===== Bands ===== -->
  <rect x="40" y="110" width="1120" height="150" rx="20" fill="#a78bfa10" stroke="#a78bfa40"/>
  <rect x="40" y="290" width="1120" height="150" rx="20" fill="#22d3ee10" stroke="#22d3ee40"/>
  <rect x="40" y="470" width="1120" height="150" rx="20" fill="#fbbf2410" stroke="#fbbf2440"/>
  <rect x="40" y="650" width="1120" height="150" rx="20" fill="#4ade8010" stroke="#4ade8040"/>

  <g font-size="12" font-weight="700" letter-spacing="2" text-anchor="end">
    <text x="1138" y="136" fill="#c4b5fd">STAGE 1 · CONCEPT</text>
    <text x="1138" y="316" fill="#67e8f9">STAGE 2 · MESH</text>
    <text x="1138" y="496" fill="#fcd34d">STAGE 3 · RIG &amp; ANIMATE</text>
    <text x="1138" y="676" fill="#86efac">STAGE 4 · EXPORT</text>
  </g>

  <!-- ===== Return connectors (checkpoint → next stage) ===== -->
  <g fill="none" stroke-width="2.5" stroke-dasharray="6 6">
    <path d="M1020 238 V274 Q1020 278 1016 278 H160 Q155 278 155 284 V326" stroke="#22d3ee" marker-end="url(#aC)"/>
    <path d="M1020 418 V454 Q1020 458 1016 458 H160 Q155 458 155 464 V506" stroke="#fbbf24" marker-end="url(#aA)"/>
    <path d="M1020 598 V634 Q1020 638 1016 638 H160 Q155 638 155 644 V686" stroke="#4ade80" marker-end="url(#aG)"/>
  </g>

  <!-- ===== Row arrows ===== -->
  <g stroke-width="2.5" fill="none">
    <path d="M252 198 H296" stroke="#a78bfa" marker-end="url(#aV)"/>
    <path d="M552 198 H596" stroke="#a78bfa" marker-end="url(#aV)"/>
    <path d="M852 198 H896" stroke="#f472b6" marker-end="url(#aP)"/>

    <path d="M252 378 H296" stroke="#22d3ee" marker-end="url(#aC)"/>
    <path d="M552 378 H596" stroke="#22d3ee" marker-end="url(#aC)"/>
    <path d="M852 378 H896" stroke="#f472b6" marker-end="url(#aP)"/>

    <path d="M252 558 H296" stroke="#fbbf24" marker-end="url(#aA)"/>
    <path d="M552 558 H596" stroke="#fbbf24" marker-end="url(#aA)"/>
    <path d="M852 558 H896" stroke="#f472b6" marker-end="url(#aP)"/>

    <!-- export fork -->
    <path d="M252 738 H266 C282 738 280 708 296 708" stroke="#4ade80" marker-end="url(#aG)"/>
    <path d="M252 738 H266 C282 738 280 768 296 768" stroke="#4ade80" marker-end="url(#aG)"/>
    <path d="M552 708 C576 708 572 738 596 738" stroke="#4ade80" marker-end="url(#aG)"/>
    <path d="M552 768 C576 768 572 738 596 738" stroke="#4ade80" marker-end="url(#aG)"/>
  </g>

  <!-- ===== Node style helpers via groups ===== -->
  <!-- Row 1 -->
  <g filter="url(#soft)">
    <rect x="60" y="160" width="190" height="76" rx="14" fill="#1d1838" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="300" y="160" width="250" height="76" rx="14" fill="#1d1838" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="600" y="160" width="250" height="76" rx="14" fill="#1d1838" stroke="#a78bfa" stroke-width="1.5"/>
  </g>
  <g>
    <text x="80" y="207" font-size="24">✍️</text>
    <text x="118" y="192" font-size="16" font-weight="700" fill="#f1f5f9">Describe</text>
    <text x="118" y="214" font-size="13" fill="#a5b4fc">one sentence</text>

    <text x="320" y="207" font-size="24">🧠</text>
    <text x="358" y="192" font-size="16" font-weight="700" fill="#f1f5f9">LLM</text>
    <text x="358" y="214" font-size="13" fill="#a5b4fc">writes the prompt</text>

    <text x="620" y="207" font-size="24">🎨</text>
    <text x="658" y="192" font-size="16" font-weight="700" fill="#f1f5f9">ComfyUI</text>
    <text x="658" y="214" font-size="13" fill="#a5b4fc">draws 4 concepts</text>
  </g>

  <!-- Row 2 -->
  <g filter="url(#soft)">
    <rect x="60" y="340" width="190" height="76" rx="14" fill="#0f2633" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="300" y="340" width="250" height="76" rx="14" fill="#0f2633" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="600" y="340" width="250" height="76" rx="14" fill="#0f2633" stroke="#22d3ee" stroke-width="1.5"/>
  </g>
  <g>
    <text x="80" y="387" font-size="24">🖼️</text>
    <text x="118" y="372" font-size="16" font-weight="700" fill="#f1f5f9">Concept</text>
    <text x="118" y="394" font-size="13" fill="#67e8f9">the image you picked</text>

    <text x="320" y="387" font-size="24">🧊</text>
    <text x="358" y="372" font-size="16" font-weight="700" fill="#f1f5f9">Hunyuan3D</text>
    <text x="358" y="394" font-size="13" fill="#67e8f9">builds the mesh</text>

    <text x="620" y="387" font-size="24">🧹</text>
    <text x="658" y="372" font-size="16" font-weight="700" fill="#f1f5f9">Blender</text>
    <text x="658" y="394" font-size="13" fill="#67e8f9">cleans it + makes LODs</text>
  </g>

  <!-- Row 3 -->
  <g filter="url(#soft)">
    <rect x="60" y="520" width="190" height="76" rx="14" fill="#2a2010" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="300" y="520" width="250" height="76" rx="14" fill="#2a2010" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="600" y="520" width="250" height="76" rx="14" fill="#2a2010" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  <g>
    <text x="80" y="567" font-size="24">🗿</text>
    <text x="118" y="552" font-size="16" font-weight="700" fill="#f1f5f9">Clean mesh</text>
    <text x="118" y="574" font-size="13" fill="#fcd34d">with LODs</text>

    <text x="320" y="567" font-size="24">🦴</text>
    <text x="358" y="552" font-size="16" font-weight="700" fill="#f1f5f9">UniRig</text>
    <text x="358" y="574" font-size="13" fill="#fcd34d">rigs the skeleton</text>

    <text x="620" y="567" font-size="24">🎬</text>
    <text x="658" y="552" font-size="16" font-weight="700" fill="#f1f5f9">Blender</text>
    <text x="658" y="574" font-size="13" fill="#fcd34d">plays clips · renders sprites</text>
  </g>

  <!-- Row 4 -->
  <g filter="url(#soft)">
    <rect x="60" y="700" width="190" height="76" rx="14" fill="#0f2a1a" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="300" y="686" width="250" height="44" rx="12" fill="#0f2a1a" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="300" y="746" width="250" height="44" rx="12" fill="#0f2a1a" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="600" y="700" width="250" height="76" rx="14" fill="#123620" stroke="#4ade80" stroke-width="2"/>
  </g>
  <g>
    <text x="80" y="747" font-size="24">🏃</text>
    <text x="118" y="732" font-size="16" font-weight="700" fill="#f1f5f9">Character</text>
    <text x="118" y="754" font-size="13" fill="#86efac">rigged + animated</text>

    <text x="320" y="714" font-size="18">🟦</text>
    <text x="352" y="713" font-size="16" font-weight="700" fill="#f1f5f9">Unity</text>
    <text x="320" y="774" font-size="18">🟩</text>
    <text x="352" y="773" font-size="16" font-weight="700" fill="#f1f5f9">Godot</text>
    <text x="425" y="744" font-size="12" font-weight="700" fill="#86efac" text-anchor="middle" letter-spacing="2">OR</text>

    <text x="620" y="747" font-size="24">🎮</text>
    <text x="658" y="732" font-size="16" font-weight="700" fill="#f1f5f9">Ready to play</text>
    <text x="658" y="754" font-size="13" fill="#86efac">in your game project</text>
  </g>

  <!-- ===== Human checkpoints ===== -->
  <g filter="url(#glow)">
    <rect x="900" y="160" width="240" height="76" rx="38" fill="#2b1230" stroke="#f472b6" stroke-width="2"/>
    <rect x="900" y="340" width="240" height="76" rx="38" fill="#2b1230" stroke="#f472b6" stroke-width="2"/>
    <rect x="900" y="520" width="240" height="76" rx="38" fill="#2b1230" stroke="#f472b6" stroke-width="2"/>
  </g>
  <g>
    <circle cx="940" cy="198" r="22" fill="#f472b6"/>
    <text x="940" y="206" font-size="22" font-weight="800" fill="#2b1230" text-anchor="middle">1</text>
    <text x="976" y="192" font-size="16" font-weight="700" fill="#fdf2f8">Pick one</text>
    <text x="976" y="214" font-size="13" fill="#f9a8d4">you choose a concept</text>

    <circle cx="940" cy="378" r="22" fill="#f472b6"/>
    <text x="940" y="386" font-size="22" font-weight="800" fill="#2b1230" text-anchor="middle">2</text>
    <text x="976" y="372" font-size="16" font-weight="700" fill="#fdf2f8">Approve</text>
    <text x="976" y="394" font-size="13" fill="#f9a8d4">you check the mesh</text>

    <circle cx="940" cy="558" r="22" fill="#f472b6"/>
    <text x="940" y="566" font-size="22" font-weight="800" fill="#2b1230" text-anchor="middle">3</text>
    <text x="976" y="552" font-size="16" font-weight="700" fill="#fdf2f8">Approve</text>
    <text x="976" y="574" font-size="13" fill="#f9a8d4">you check the motion</text>
  </g>

  <!-- ===== Legend ===== -->
  <g font-size="13" fill="#94a3b8">
    <rect x="60" y="822" width="28" height="16" rx="5" fill="#1d1838" stroke="#a78bfa"/>
    <text x="96" y="835">AI / tool step</text>
    <rect x="210" y="822" width="28" height="16" rx="5" fill="none" stroke="#94a3b8" stroke-dasharray="3 3"/>
    <text x="246" y="835">result from the stage before</text>
    <rect x="460" y="822" width="28" height="16" rx="8" fill="#2b1230" stroke="#f472b6"/>
    <text x="496" y="835">human checkpoint</text>
  </g>
</svg>
